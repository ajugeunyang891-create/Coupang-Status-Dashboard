- name: 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add index.html
          git diff --cached --quiet || git commit -m "대시보드 자동 업데이트 $(date '+%Y-%m-%d %H:%M KST')"
          git push
